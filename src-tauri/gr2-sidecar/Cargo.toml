[package]
name = "gr2-sidecar"
version = "0.1.0"
edition = "2021"
description = "32-bit helper process that loads a Metin2 client's own granny2.dll to parse .gr2 models (bitness bridge for the 64-bit M2Manager app)"

[[bin]]
name = "gr2-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
