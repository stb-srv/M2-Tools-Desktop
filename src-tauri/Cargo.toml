[package]
name = "m2manager"
version = "0.13.3"
description = "M2Manager - Metin2 Server Management Desktop App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "m2manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.54", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.2"
encoding_rs = "0.8.35"
image = { version = "0.25.10", default-features = false, features = ["tga", "png", "jpeg", "bmp", "gif"] }
base64 = "0.23.0"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
ddsfile = "0.5"
chrono = "0.4.45"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "mysql", "chrono"]

[profile.release]
# Strips debug symbols/local variable names from the shipped .exe - doesn't
# stop reverse engineering (nothing can), but removes the easy on-ramp of
# readable symbol names for anyone poking at the binary with a disassembler.
strip = true
# "Fat" LTO (`lto = true`) forces the whole dependency graph through a
# single-threaded codegen unit at link time - by far the biggest cost in
# `npm run release` for this project (minutes, not the ~9s the Vite side
# takes). Thin LTO cross-optimizes each crate in parallel and only does a
# lighter global pass, cutting release build time substantially for a
# GUI app like this where the last few % of codegen optimization doesn't
# matter, while keeping the exe close in size/speed to fat LTO.
lto = "thin"

