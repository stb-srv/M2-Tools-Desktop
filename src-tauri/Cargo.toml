[package]
name = "m2manager"
version = "0.1.0"
description = "M2Manager - Metin2 Server Management Desktop App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "m2manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.54"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.2"
encoding_rs = "0.8.35"
image = { version = "0.25.10", default-features = false, features = ["tga", "png"] }
base64 = "0.23.0"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
ddsfile = "0.5"
chrono = "0.4.45"

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "mysql", "chrono"]

