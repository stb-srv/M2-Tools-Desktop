version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /src-tauri/gr2-sidecar
      - /ui
      - /tools/release
      - /e2e
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # image_dds nutzt intern ddsfile 0.5; ein eigenes 0.6 kompiliert nicht.
      - dependency-name: ddsfile
        versions: [">=0.6"]
      # Gleiche Version wie Tauri/Ökosystem (0.22), sonst doppelt im Lockfile.
      - dependency-name: base64
        versions: [">=0.23"]
