name: Release

# Ausgelöst durch einen gepushten Git-Tag "vX.Y.Z" (siehe howtorelease.md).
# Baut, signiert und veröffentlicht komplett automatisch - siehe
# ~/.claude/plans/immutable-mapping-snowglobe.md für die volle Herleitung.
# Das Repo ist öffentlich: die App fragt latest.json und die Installer ohne
# Token ab (kein eingebetteter GH_RELEASE_TOKEN mehr).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Der Tag muss zur Version in package.json, tauri.conf.json und
      # Cargo.toml passen. Sonst baut die Pipeline still die alte Version,
      # latest.json meldet keine neuere Version und installierte Apps finden
      # nie ein Update (so passiert bei v0.17.0, das als 0.16.0 gebaut wurde).
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag passt nicht zur Version in den Dateien (package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo). Erst Version hochzählen, committen, dann taggen."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish the GitHub Release
        id: tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "M2Manager ${{ github.ref_name }}"
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Rewrite latest.json to use api.github.com asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/rewrite-latest-json.mjs "${{ steps.tauri-action.outputs.releaseId }}"

      - name: Commit updater/latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/latest.json
          git diff --cached --quiet || git commit -m "chore: update updater/latest.json for ${{ github.ref_name }}"
          git push origin HEAD:master
