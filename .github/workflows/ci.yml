name: CI

# Prüft jeden Pull Request und jeden Push auf master: Tests und WASM-Build des
# Leptos-Frontends (ui/) und die Backend-Tests. Integrationstests, die echte
# Client-Dateien, eine echte Datenbank oder einen Server brauchen, sind mit
# #[ignore] markiert und laufen hier bewusst nicht (siehe src-tauri/src/test_support.rs).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    name: Release-Notes (CHANGELOG.md zur App-Version)
    # Jede Version braucht einen Abschnitt in CHANGELOG.md - daraus kommen
    # "Was ist neu" in der App, der Update-Hinweis und der GitHub-Release-Text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "tools/release -> target"

      - name: Tests der Release-Tools
        working-directory: tools/release
        run: cargo test

      - name: Changelog-Eintrag für die aktuelle Version vorhanden
        run: cargo run --manifest-path tools/release/Cargo.toml --bin changelog -- check

  frontend:
    name: Frontend (Rust/Leptos, Tests + WASM-Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "ui -> target"

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: trunk

      - name: Logik-Tests
        working-directory: ui
        run: cargo test

      - name: WASM-Build (Trunk + Tailwind)
        working-directory: ui
        run: trunk build --release

  rust:
    name: Rust-Tests
    # Windows wie die ausgelieferte App - dort läuft auch der
    # Schlüsselbund-Test (Windows Credential Manager) mit.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      # tauri_build prüft beim Kompilieren, dass frontendDist existiert.
      - name: Platzhalter für das Frontend-Bundle
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  e2e-build:
    name: E2E-Test kompiliert (cargo check)
    # Der E2E-Smoke-Test läuft nicht in CI (braucht tauri-driver und die gebaute
    # App), soll aber nicht unbemerkt veralten.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "e2e -> target"

      - name: cargo check
        working-directory: e2e
        run: cargo check --locked

  audit:
    name: Sicherheitsprüfung der Abhängigkeiten (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-audit

      - name: cargo audit (src-tauri)
        working-directory: src-tauri
        run: cargo audit

      - name: cargo audit (ui)
        working-directory: ui
        run: cargo audit

  fmt:
    name: Formatierung (cargo fmt --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          components: rustfmt

      - name: cargo fmt --check (alle Crates)
        shell: bash
        run: |
          for dir in src-tauri src-tauri/gr2-sidecar ui tools/release e2e; do
            echo "::group::$dir"
            (cd "$dir" && cargo fmt --check)
            echo "::endgroup::"
          done

  clippy-backend:
    name: Clippy (src-tauri, -D warnings)
    # Windows wie der Rust-Test-Job: das Backend hat Windows-spezifische Abhängigkeiten.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      # tauri_build prüft beim Kompilieren, dass frontendDist existiert.
      - name: Platzhalter für das Frontend-Bundle
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  clippy-frontend:
    name: Clippy (ui, WASM, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "ui -> target"

      - name: cargo clippy
        working-directory: ui
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  clippy-release-tools:
    name: Clippy (tools/release, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "tools/release -> target"

      - name: cargo clippy
        working-directory: tools/release
        run: cargo clippy --all-targets -- -D warnings
