name: CI

# Prüft jeden Pull Request und jeden Push auf master: Tests und WASM-Build des
# Leptos-Frontends (ui/) und die Backend-Tests. Integrationstests, die echte
# Client-Dateien, eine echte Datenbank oder einen Server brauchen, sind mit
# #[ignore] markiert und laufen hier bewusst nicht (siehe src-tauri/src/test_support.rs).
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Rust/Leptos: Tests, WASM-Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ui -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Logik-Tests
        working-directory: ui
        run: cargo test

      - name: WASM-Build (Trunk + Tailwind)
        working-directory: ui
        run: trunk build --release

  rust:
    name: Rust-Tests
    # Windows wie die ausgelieferte App - dort läuft auch der
    # Schlüsselbund-Test (Windows Credential Manager) mit.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # tauri_build prüft beim Kompilieren, dass frontendDist existiert.
      - name: Platzhalter für das Frontend-Bundle
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
