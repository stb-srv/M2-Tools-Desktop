name: Test-Build

# Baut bei jedem Pull Request einen Windows-Installer zum Ausprobieren und
# hängt ihn als Actions-Artefakt an den Lauf. Wird NICHT veröffentlicht und
# ändert updater/latest.json nicht - installierte Apps bekommen davon nichts mit.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable-Branch
        with:
          toolchain: 1.100.0 # gleich wie rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            ui -> target
            src-tauri/gr2-sidecar -> target

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: trunk,tauri-cli@2.11.5

      # Der 3D-Viewer braucht den 32-Bit-Sidecar (lädt die 32-Bit granny2.dll des
      # Clients). Tauri erwartet ihn als binaries/gr2-sidecar-<Haupt-Triple>.exe,
      # auch wenn die Exe selbst 32-Bit ist.
      - name: GR2-Sidecar (32-Bit) bauen
        shell: bash
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --locked --target i686-pc-windows-msvc --manifest-path src-tauri/gr2-sidecar/Cargo.toml
          mkdir -p src-tauri/binaries
          cp src-tauri/gr2-sidecar/target/i686-pc-windows-msvc/release/gr2-sidecar.exe src-tauri/binaries/gr2-sidecar-x86_64-pc-windows-msvc.exe

      # Ohne Updater-Artefakte, damit kein Signierschlüssel nötig ist.
      - name: Installer bauen
        shell: bash
        run: cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false,"externalBin":["binaries/gr2-sidecar"]}}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: M2Manager-Test-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
