[package]
name = "m2manager-ui"
version = "0.30.0"
edition = "2021"
description = "M2Manager frontend (Leptos, compiled to WebAssembly and shown inside the Tauri window)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# Markdown (Handbuch, Quest-Wiki, Update-Notizen) and text diffs (Backups, Locale-Editor)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
similar = "2"
# 3D math for the WebGL model viewer
glam = "0.30"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "DomRect",
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlCanvasElement", "HtmlImageElement",
  "KeyboardEvent", "MouseEvent", "WheelEvent", "PointerEvent", "Event", "EventTarget", "FocusEvent", "DragEvent", "InputEvent",
  "CssStyleDeclaration", "DomTokenList", "Storage", "MediaQueryList", "MediaQueryListEvent", "Location", "History",
  "CanvasRenderingContext2d", "ImageData", "TextMetrics",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlUniformLocation",
  "WebGlVertexArrayObject", "WebGlTexture",
  "Navigator", "Clipboard", "Performance", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "ResizeObserver", "ResizeObserverEntry", "Selection", "Range",
  "WebglLoseContext",
  "HtmlDocument",
  "EventInit",
  "SvgElement", "SvgGraphicsElement", "SvgsvgElement", "SvgMatrix",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
